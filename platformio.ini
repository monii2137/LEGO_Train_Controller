[platformio]
default_envs = seeed_xiao_esp32s3

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

[env:seeed_xiao_esp32s3]
build_src_filter = +<*> -<UltrasonicTest.cpp>

[env:ultrasonic_test]
build_src_filter = -<*> +<UltrasonicTest.cpp> +<UltrasonicSensor.cpp>